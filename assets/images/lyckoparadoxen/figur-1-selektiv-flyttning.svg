<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
<title id="title">Individerna får det bättre, men områdets siffror står still</title>
<desc id="desc">Tre av tio har arbete före insatserna och sex efter. Tre med arbete flyttar till ett starkare område och ersätts av tre utan arbete. Områdets andel med arbete återgår till 30 procent.</desc>
<defs>
<circle id="job" r="12" fill="#3f5564"/>
<circle id="nojob" r="12" fill="#d1d9dc" stroke="#3f5564" stroke-width="0.8"/>
<circle id="new" r="11.5" fill="#ffffff" stroke="#3f5564" stroke-width="1.3" stroke-dasharray="3 3"/>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3f5564"/></marker>
</defs>
<rect width="1000" height="580" fill="#ffffff"/>
<g font-family="Open Sans, Arial, sans-serif" fill="#1f1f1f" font-size="16">
<text x="16" y="28" font-size="22" font-weight="800">Individerna får det bättre, men områdets siffror står still</text>
<use href="#job" x="28" y="57"/><text x="48" y="63">har arbete</text>
<use href="#nojob" x="197" y="57"/><text x="217" y="63">utan arbete</text>
<use href="#new" x="370" y="57"/><text x="390" y="63">nyinflyttad utan arbete</text>
<g fill="#ffffff" stroke="#8ca3af" stroke-width="1.3">
<rect x="16" y="96" width="286" height="208" rx="10"/>
<rect x="357" y="96" width="286" height="208" rx="10"/>
<rect x="698" y="96" width="286" height="208" rx="10"/>
<rect x="357" y="373" width="286" height="88" rx="10"/>
<rect x="800" y="373" width="184" height="88" rx="10" fill="#c0e4f2" stroke="#3f5564" stroke-width="2"/>
<rect x="16" y="492" width="968" height="76" rx="10" fill="#f4f6f7"/>
</g>
<g font-size="18" font-weight="700" text-anchor="middle">
<text x="159" y="133">1. Före insatserna</text>
<text x="500" y="133">2. Insatserna ger jobb</text>
<text x="841" y="133">3. Efter flyttningarna</text>
</g>
<use href="#job" x="52" y="179"/><use href="#job" x="105" y="179"/><use href="#job" x="158" y="179"/><use href="#nojob" x="211" y="179"/><use href="#nojob" x="264" y="179"/>
<use href="#nojob" x="52" y="223"/><use href="#nojob" x="105" y="223"/><use href="#nojob" x="158" y="223"/><use href="#nojob" x="211" y="223"/><use href="#nojob" x="264" y="223"/>
<use href="#job" x="393" y="179"/><use href="#job" x="446" y="179"/><use href="#job" x="499" y="179"/><use href="#job" x="552" y="179"/><use href="#job" x="605" y="179"/>
<use href="#job" x="393" y="223"/><use href="#nojob" x="446" y="223"/><use href="#nojob" x="499" y="223"/><use href="#nojob" x="552" y="223"/><use href="#nojob" x="605" y="223"/>
<use href="#job" x="734" y="179"/><use href="#job" x="787" y="179"/><use href="#job" x="840" y="179"/><use href="#nojob" x="893" y="179"/><use href="#nojob" x="946" y="179"/>
<use href="#nojob" x="734" y="223"/><use href="#nojob" x="787" y="223"/><use href="#new" x="840" y="223"/><use href="#new" x="893" y="223"/><use href="#new" x="946" y="223"/>
<g text-anchor="middle">
<text x="159" y="276">3 av 10 har arbete</text><text x="500" y="276">6 av 10 har arbete</text><text x="841" y="276">3 av 10 har arbete igen</text>
<text x="500" y="403" font-size="18">Nya inflyttare</text><text x="892" y="403" font-size="18">Starkare område</text>
<text x="500" y="522" font-weight="700" font-size="18">Områdets statistik: 30 % → 60 % → 30 % har arbete</text>
<text x="500" y="550">Av de tio som bodde där från början har sex fått arbete, och tre av dem har flyttat</text>
</g>
<use href="#new" x="446" y="437"/><use href="#new" x="499" y="437"/><use href="#new" x="552" y="437"/>
<use href="#job" x="852" y="437"/><use href="#job" x="893" y="437"/><use href="#job" x="934" y="437"/>
<g fill="none" stroke="#3f5564" stroke-width="1.3" marker-end="url(#arrow)">
<path d="M302 202H347"/><path d="M643 202H688"/>
<path d="M643 418H730V315"/><path d="M910 313V361"/>
</g>
<text x="652" y="407">flyttar in</text><text x="923" y="343">flyttar ut</text>
</g>
</svg>
